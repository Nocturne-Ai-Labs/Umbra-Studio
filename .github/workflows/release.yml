name: Build portable releases

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the artifacts as a GitHub release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag when publishing, for example v0.20.0
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Verify release identity before packaging
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: node scripts/verify-release-identity.mjs
      - run: bun install --frozen-lockfile
      - name: Install native Windows media build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make nasm tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
      - name: Build Windows media from pinned sources
        shell: msys2 {0}
        run: |
          source_root="$(cygpath -u "$GITHUB_WORKSPACE")"
          bash scripts/build-media-from-source.sh win32 "$source_root/release/media-source-win32" "$source_root/release/media-work-win32"
      - name: Build Windows BAT portable folder
        shell: pwsh
        env:
          UMBRA_MEDIA_SOURCE_BUILD: ${{ github.workspace }}\release\media-source-win32
          UMBRA_PUBLISH_ROOT: ${{ github.workspace }}\release\windows-bat\Umbra Studio
          UMBRA_WEBAPP_CLEAN_RELEASE: '1'
          UMBRA_BUNDLE_DATA_FORGE_MODELS: '0'
        run: bun run webapp:update-folder:no-bump
      - name: Archive Windows BAT package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $batPackageRoot = "release/windows-bat/Umbra Studio"
          function Assert-CommonPackage([string] $packageRoot) {
            if (!(Test-Path "$packageRoot/resources/app/defaults/DataForge/model-manifest.json")) { throw 'Data Forge model manifest is missing' }
            if (!(Test-Path "$packageRoot/resources/app/defaults/UmbraUI/model-manifest.json")) { throw 'Umbra UI model manifest is missing' }
            if (!(Test-Path "$packageRoot/resources/app/defaults/UmbraUI/model-requirements-manifest.json")) { throw 'Model requirements manifest is missing' }
            if (!(Test-Path "$packageRoot/resources/app/defaults/UmbraUI/tool-requirements.json")) { throw 'Managed tool requirements manifest is missing' }
            if (!(Test-Path "$packageRoot/UmbraSetup.bat")) { throw 'Standalone Umbra setup launcher is missing' }
            if (!(Test-Path "$packageRoot/resources/app/setup/UmbraSetupApp.js")) { throw 'Standalone Umbra setup service is missing' }
            if (!(Test-Path "$packageRoot/resources/app/setup/models.js")) { throw 'Model setup interface is missing' }
            foreach ($name in @('Install-Data-Forge-Models.bat', 'Install-Umbra-UI-Models.bat', 'Install-Umbra-UI-Support-Models.bat', 'Install-Model-Requirements.bat')) {
              if (Test-Path "$packageRoot/$name") { throw "Retired model shortcut is still packaged: $name" }
            }
          }
          Assert-CommonPackage $batPackageRoot
          if (!(Test-Path "$batPackageRoot/UmbraStudio.bat")) { throw 'Umbra Studio BAT launcher is missing' }
          if (Test-Path "$batPackageRoot/UmbraStudio.exe") { throw 'BAT package must not include the EXE launcher' }
          $comfyRoot = [System.IO.Path]::GetFullPath("$batPackageRoot/Tools/ComfyUI")
          [System.IO.Directory]::CreateDirectory($comfyRoot) | Out-Null
          $bunBinary = Join-Path $batPackageRoot 'Runtime/Bun/win32/bun.exe'
          $installerScript = Join-Path $batPackageRoot 'resources/app/scripts/download-umbra-model-requirements.mjs'
          $installerOutput = (& $bunBinary $installerScript --verify-target --family anima --comfy-root $comfyRoot 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Packaged model installer returned unexpected status $LASTEXITCODE`n$installerOutput" }
          $expectedModelsRoot = [System.IO.Path]::Combine($comfyRoot, 'models')
          if ($installerOutput -notlike "*$expectedModelsRoot*") {
            throw "Packaged model installer did not target root ComfyUI models: $expectedModelsRoot`n$installerOutput"
          }
          if ($installerOutput -like '*resources\app\Tools\ComfyUI*') {
            throw "Packaged model installer incorrectly targeted resources/app/Tools/ComfyUI`n$installerOutput"
          }
          [System.IO.Directory]::Delete($comfyRoot, $true)
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $artifactsRoot = (Resolve-Path artifacts).Path
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $batPackageRoot).Path, (Join-Path $artifactsRoot "Umbra-Studio-v$version-Windows-x64-BAT.zip"), [System.IO.Compression.CompressionLevel]::Optimal, $true)
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-studio-windows
          path: artifacts/*

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Verify release identity before packaging
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: node scripts/verify-release-identity.mjs
      - run: bun install --frozen-lockfile
      - name: Install native Linux media build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm cmake pkg-config python3
      - name: Build Linux media from pinned sources
        run: bash scripts/build-media-from-source.sh linux "$GITHUB_WORKSPACE/release/media-source-linux" "$GITHUB_WORKSPACE/release/media-work-linux"
      - name: Build Linux portable folder
        env:
          UMBRA_MEDIA_SOURCE_BUILD: ${{ github.workspace }}/release/media-source-linux
          UMBRA_LINUX_PUBLISH_ROOT: ${{ github.workspace }}/release/linux/Umbra Studio
          UMBRA_WEBAPP_CLEAN_RELEASE: '1'
          UMBRA_BUNDLE_DATA_FORGE_MODELS: '0'
          UMBRA_BUNDLED_BUN_VERSION: canary
        run: bun run linux:update-folder:no-bump
      - name: Archive Linux package
        run: |
          version="$(node -p "require('./package.json').version")"
          package_root="release/linux/Umbra Studio"
          test -f "${package_root}/resources/app/defaults/DataForge/model-manifest.json"
          test -f "${package_root}/resources/app/defaults/UmbraUI/model-manifest.json"
          test -f "${package_root}/resources/app/defaults/UmbraUI/model-requirements-manifest.json"
          test -f "${package_root}/resources/app/defaults/UmbraUI/tool-requirements.json"
          test -f "${package_root}/umbra-setup.sh"
          test -f "${package_root}/resources/app/setup/UmbraSetupApp.js"
          test -f "${package_root}/resources/app/setup/models.js"
          for retired in install-data-forge-models.sh install-umbra-ui-models.sh install-umbra-ui-support-models.sh install-model-requirements.sh; do
            test ! -e "${package_root}/${retired}"
          done
          bundled_bun_version="$("${package_root}/Runtime/Bun/linux/bun" --version)"
          case "${bundled_bun_version}" in
            1.4.*) ;;
            *) echo "Expected bundled Linux Bun 1.4.x, got ${bundled_bun_version}" >&2; exit 1 ;;
          esac
          mkdir -p artifacts
          (cd "release/linux" && zip -r -9 "${GITHUB_WORKSPACE}/artifacts/Umbra-Studio-v${version}-Linux-x64.zip" "Umbra Studio")
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-studio-linux
          path: artifacts/*

  validate:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: umbra-studio-*
          merge-multiple: true
          path: artifacts
      - name: Validate both portable archives
        run: python3 scripts/validate-release-archives.py artifacts

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: umbra-studio-*
          merge-multiple: true
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          python3 scripts/validate-release-archives.py artifacts
          node scripts/verify-release-identity.mjs
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          awk -v heading="## v${version}" '
            $0 == heading || index($0, heading " - ") == 1 { capture=1; next }
            capture && /^## v/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release notes for ${tag} were not found in CHANGELOG.md" >&2
            exit 1
          fi
          awk '
            BEGIN {
              mobile="**Umbra Studio Mobile is experimental and is not ready for feedback.**"
              canvas="**Canvas is experimental on desktop and tablet and is not ready for feedback. Phone Remote does not expose Canvas. Background removal runs exclusively on CPU and was checked on illustrated fixtures with soft alpha and request-scoped cancellation. Photographic subjects, fresh GPU generation, physical touch interaction, and complete localization remain unqualified.**"
              video="**Video generation is in beta and is not ready for feedback. MiniMax H3 is somewhat usable; other video models remain experimental and less reliable.**"
              print mobile "\n\n" canvas "\n\n" video "\n"
            }
            { sub(/\r$/, "") }
            $0 != mobile && $0 != canvas && $0 != video { print }
          ' release-notes.md > release-notes-warnings.md
          mv release-notes-warnings.md release-notes.md
          gh release create "${tag}" \
            "artifacts/Umbra-Studio-v${version}-Windows-x64-BAT.zip" \
            "artifacts/Umbra-Studio-v${version}-Linux-x64.zip" \
            --verify-tag --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md --title "Umbra Studio ${tag}"
