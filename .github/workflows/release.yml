name: Build portable releases

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the artifacts as a GitHub release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag when publishing, for example v0.20.0
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_ENABLED: ${{ vars.ENABLE_WINDOWS_SIGNING == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - name: Build Windows portable folder
        shell: pwsh
        env:
          UMBRA_PUBLISH_ROOT: ${{ github.workspace }}\release\windows\Umbra Studio
          UMBRA_WEBAPP_CLEAN_RELEASE: '1'
          UMBRA_BUNDLE_DATA_FORGE_MODELS: '0'
        run: bun run webapp:update-folder:no-bump
      - name: Validate Windows signing configuration
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $required = @{
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            ARTIFACT_SIGNING_ENDPOINT = $env:ARTIFACT_SIGNING_ENDPOINT
            ARTIFACT_SIGNING_ACCOUNT_NAME = $env:ARTIFACT_SIGNING_ACCOUNT_NAME
            ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME = $env:ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME
            WINDOWS_SIGNING_SUBJECT = $env:WINDOWS_SIGNING_SUBJECT
          }
          $missing = @($required.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace([string]$_.Value)
          } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Windows release signing is required. Configure these repository secrets/variables: $($missing -join ', ')"
          }
      - name: Sign in to Azure
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Umbra Studio launcher
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\release\windows\Umbra Studio\UmbraStudio.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Umbra Studio
          description-url: https://github.com/Nocturne-Ai-Labs/Umbra-Studio
      - name: Verify Umbra Studio signature
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $launcher = (Resolve-Path "release/windows/Umbra Studio/UmbraStudio.exe").Path
          $signature = Get-AuthenticodeSignature -LiteralPath $launcher
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "UmbraStudio.exe Authenticode signature is not valid: $($signature.StatusMessage)"
          }
          if ($signature.SignerCertificate.Subject -notlike "*$env:WINDOWS_SIGNING_SUBJECT*") {
            throw "UmbraStudio.exe signer '$($signature.SignerCertificate.Subject)' does not match '$env:WINDOWS_SIGNING_SUBJECT'."
          }
          Write-Host "Verified signed launcher: $($signature.SignerCertificate.Subject)"
      - name: Report unsigned Windows build
        if: env.WINDOWS_SIGNING_ENABLED != 'true'
        shell: pwsh
        run: Write-Warning "Publishing Umbra Studio without Authenticode signing. Set ENABLE_WINDOWS_SIGNING=true after configuring Artifact Signing to enable the signed release path."
      - name: Archive Windows package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packageRoot = "release/windows/Umbra Studio"
          if (!(Test-Path "$packageRoot/Install-Data-Forge-Models.bat")) { throw 'Data Forge model installer is missing' }
          if (!(Test-Path "$packageRoot/resources/app/defaults/DataForge/model-manifest.json")) { throw 'Data Forge model manifest is missing' }
          if (!(Test-Path "$packageRoot/Install-Umbra-UI-Models.bat")) { throw 'Umbra UI model installer is missing' }
          if (!(Test-Path "$packageRoot/resources/app/defaults/UmbraUI/model-manifest.json")) { throw 'Umbra UI model manifest is missing' }
          if (!(Test-Path "$packageRoot/UmbraSetup.bat")) { throw 'Standalone Umbra setup launcher is missing' }
          if (!(Test-Path "$packageRoot/resources/app/setup/UmbraSetupApp.js")) { throw 'Standalone Umbra setup service is missing' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "$packageRoot/resources/app/defaults/DataForge/model-manifest.json" "artifacts/Data-Forge-Models-v$version.json"
          Copy-Item "$packageRoot/resources/app/defaults/UmbraUI/model-manifest.json" "artifacts/Umbra-UI-Support-Models-v$version.json"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $sourcePath = (Resolve-Path $packageRoot).Path
          $archivePath = Join-Path (Resolve-Path artifacts).Path "Umbra-Studio-v$version-Windows-x64.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $sourcePath,
            $archivePath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true
          )
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-studio-windows
          path: artifacts/*

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - name: Build Linux portable folder
        env:
          UMBRA_LINUX_PUBLISH_ROOT: ${{ github.workspace }}/release/linux/Umbra Studio
          UMBRA_WEBAPP_CLEAN_RELEASE: '1'
          UMBRA_BUNDLE_DATA_FORGE_MODELS: '0'
          UMBRA_BUNDLED_BUN_VERSION: canary
        run: bun run linux:update-folder:no-bump
      - name: Archive Linux package
        run: |
          version="$(node -p "require('./package.json').version")"
          package_root="release/linux/Umbra Studio"
          test -f "${package_root}/install-data-forge-models.sh"
          test -f "${package_root}/resources/app/defaults/DataForge/model-manifest.json"
          test -f "${package_root}/install-umbra-ui-models.sh"
          test -f "${package_root}/resources/app/defaults/UmbraUI/model-manifest.json"
          test -f "${package_root}/umbra-setup.sh"
          test -f "${package_root}/resources/app/setup/UmbraSetupApp.js"
          bundled_bun_version="$("${package_root}/Runtime/Bun/linux/bun" --version)"
          case "${bundled_bun_version}" in
            1.4.*) ;;
            *) echo "Expected bundled Linux Bun 1.4.x, got ${bundled_bun_version}" >&2; exit 1 ;;
          esac
          mkdir -p artifacts
          (cd "release/linux" && zip -r -9 "${GITHUB_WORKSPACE}/artifacts/Umbra-Studio-v${version}-Linux-x64.zip" "Umbra Studio")
      - uses: actions/upload-artifact@v4
        with:
          name: umbra-studio-linux
          path: artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: umbra-studio-*
          merge-multiple: true
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="${REQUESTED_TAG}"; fi
          if [ -z "${tag}" ]; then echo "release_tag is required" >&2; exit 1; fi
          version="${tag#v}"
          awk -v heading="## v${version}" '
            $0 == heading || index($0, heading " - ") == 1 { capture=1; next }
            capture && /^## v/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release notes for ${tag} were not found in CHANGELOG.md" >&2
            exit 1
          fi
          gh release create "${tag}" artifacts/* --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md --title "Umbra Studio ${tag}"
